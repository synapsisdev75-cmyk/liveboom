<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14151c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LiveBoom" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Liveboom</title>
    <style>
      html, body { background: var(--bg-primary, #14151c); color: var(--text-primary, #fafafa); }
      html[data-lb-theme='light'], html[data-lb-theme='light'] body {
        background: var(--bg-primary, #f3f4f7);
        color: var(--text-primary, #18181b);
      }
    </style>
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || '';
          if (!/Android/i.test(ua) || /\bwv\b/.test(ua)) return;
          var path = location.pathname || '';
          if (path !== '/billetera' && path.indexOf('/billetera/') !== 0) return;
          var search = location.search || '';
          if (/[?&]lb_web=1(?:&|$)/.test(search)) return;
          if (!/[?&]origen=app(?:&|$)/.test(search)) return;
          var idMatch = search.match(/[?&]id=([^&]+)/);
          var id = idMatch ? decodeURIComponent(idMatch[1]) : '';
          var query = id ? '?id=' + encodeURIComponent(id) : '';
          var fallback = 'https://liveboomapp.com/billetera?lb_web=1' + (id ? '&id=' + encodeURIComponent(id) : '');
          location.replace(
            'intent://billetera' + query +
            '#Intent;scheme=liveboom;package=com.liveboom.app;S.browser_fallback_url=' +
            encodeURIComponent(fallback) + ';end'
          );
        } catch (handoffErr) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('liveboom:appearance');
          var prefs = raw ? JSON.parse(raw) : {};
          var theme = prefs.themeMode === 'light' || prefs.theme === 'light' ? 'light' : 'dark';
          var allowed = { default: 1, pink: 1, blue: 1, green: 1, orange: 1, red: 1, gold: 1, violet: 1 };
          var accent = allowed[prefs.accentPalette] ? prefs.accentPalette : allowed[prefs.accent] ? prefs.accent : 'default';
          var root = document.documentElement;
          root.setAttribute('data-lb-theme', theme);
          root.setAttribute('data-lb-accent', accent);
          root.style.colorScheme = theme;
          try {
            var loc = localStorage.getItem('liveboom:locale');
            if (loc === 'zh') root.lang = 'zh-CN';
            else if (loc === 'es' || loc === 'en' || loc === 'fr' || loc === 'it' || loc === 'pt') root.lang = loc;
          } catch (langErr) {}
          var css = prefs.css;
          if (css && typeof css === 'object') {
            for (var key in css) {
              if (Object.prototype.hasOwnProperty.call(css, key) && key.indexOf('--') === 0) {
                root.style.setProperty(key, String(css[key]));
              }
            }
            if (css['--bg-primary']) {
              var themeMeta = document.querySelector('meta[name="theme-color"]');
              if (themeMeta) themeMeta.setAttribute('content', String(css['--bg-primary']));
            }
          }
        } catch (e) {
          document.documentElement.setAttribute('data-lb-theme', 'dark');
          document.documentElement.setAttribute('data-lb-accent', 'default');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="lb-boot-splash" aria-busy="true" aria-live="polite">
      <div class="lb-boot-splash__stack">
        <img src="/brand/logo-clear.png" alt="LiveBoom" />
        <div
          class="lb-boot-splash__track"
          id="lb-boot-progress"
          role="progressbar"
          aria-label="Cargando LiveBoom"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="6"
        >
          <div class="lb-boot-splash__fill" id="lb-boot-progress-fill" style="width:6%"></div>
        </div>
      </div>
    </div>
    <style>
      #lb-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0b;
        overflow: hidden;
        pointer-events: auto;
      }
      .lb-boot-splash__stack {
        display: flex;
        width: min(82vw, 18rem);
        flex-direction: column;
        align-items: center;
        gap: 1.15rem;
      }
      #lb-boot-splash img {
        width: 100%;
        height: auto;
        max-height: min(46vw, 10.5rem);
        object-fit: contain;
        object-position: center;
        filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.18));
      }
      .lb-boot-splash__track {
        position: relative;
        width: min(72%, 11.5rem);
        height: 0.42rem;
        overflow: hidden;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02)),
          rgba(255, 255, 255, 0.06);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          0 0 12px rgba(236, 72, 153, 0.22),
          0 0 22px rgba(34, 211, 238, 0.16);
      }
      .lb-boot-splash__fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 6%;
        border-radius: inherit;
        background:
          linear-gradient(90deg, #ec4899 0%, #a855f7 42%, #22d3ee 100%);
        box-shadow:
          0 0 10px rgba(236, 72, 153, 0.75),
          0 0 18px rgba(34, 211, 238, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
        transition: width 220ms ease-out;
      }
      .lb-boot-splash__fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 0%,
          rgba(255, 255, 255, 0.45) 45%,
          transparent 70%
        );
        animation: lb-boot-sheen 1.25s linear infinite;
      }
      @keyframes lb-boot-sheen {
        from { transform: translateX(-120%); }
        to { transform: translateX(160%); }
      }
      #lb-boot-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 220ms ease, visibility 0s linear 220ms;
      }
    </style>
    <script>
      (function () {
        var fill = document.getElementById('lb-boot-progress-fill');
        var bar = document.getElementById('lb-boot-progress');
        var pct = 6;
        var target = 18;
        var tick = setInterval(function () {
          if (!fill) return;
          if (pct < target) {
            pct = Math.min(target, pct + 0.35);
            fill.style.width = pct.toFixed(1) + '%';
            if (bar) bar.setAttribute('aria-valuenow', String(Math.round(pct)));
          } else if (target < 42) {
            target = Math.min(42, target + 0.08);
          }
        }, 50);
        window.__lbBootProgress = {
          setTarget: function (n) {
            target = Math.max(target, Math.min(100, Number(n) || 0));
          },
          setExact: function (n) {
            pct = Math.max(pct, Math.min(100, Number(n) || 0));
            target = pct;
            if (fill) fill.style.width = pct.toFixed(1) + '%';
            if (bar) bar.setAttribute('aria-valuenow', String(Math.round(pct)));
          },
          stop: function () {
            clearInterval(tick);
          },
        };
        setTimeout(function () {
          var splash = document.getElementById('lb-boot-splash');
          if (splash) splash.classList.add('is-done');
          if (window.__lbBootProgress) window.__lbBootProgress.stop();
        }, 12000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
