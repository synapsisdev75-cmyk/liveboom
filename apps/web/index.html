<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14151c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LiveBoom" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Liveboom</title>
    <style>
      html, body { background: var(--bg-primary, #14151c); color: var(--text-primary, #fafafa); }
      html[data-lb-theme='light'], html[data-lb-theme='light'] body {
        background: var(--bg-primary, #f3f4f7);
        color: var(--text-primary, #18181b);
      }
    </style>
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || '';
          if (!/Android/i.test(ua) || /\bwv\b/.test(ua)) return;
          var path = location.pathname || '';
          if (path !== '/billetera' && path.indexOf('/billetera/') !== 0) return;
          var search = location.search || '';
          if (/[?&]lb_web=1(?:&|$)/.test(search)) return;
          if (!/[?&]origen=app(?:&|$)/.test(search)) return;
          var idMatch = search.match(/[?&]id=([^&]+)/);
          var id = idMatch ? decodeURIComponent(idMatch[1]) : '';
          var query = id ? '?id=' + encodeURIComponent(id) : '';
          var fallback = 'https://liveboomapp.com/billetera?lb_web=1' + (id ? '&id=' + encodeURIComponent(id) : '');
          location.replace(
            'intent://billetera' + query +
            '#Intent;scheme=liveboom;package=com.liveboom.app;S.browser_fallback_url=' +
            encodeURIComponent(fallback) + ';end'
          );
        } catch (handoffErr) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('liveboom:appearance');
          var prefs = raw ? JSON.parse(raw) : {};
          var theme = prefs.themeMode === 'light' || prefs.theme === 'light' ? 'light' : 'dark';
          var allowed = { default: 1, pink: 1, blue: 1, green: 1, orange: 1, red: 1, gold: 1, violet: 1 };
          var accent = allowed[prefs.accentPalette] ? prefs.accentPalette : allowed[prefs.accent] ? prefs.accent : 'default';
          var root = document.documentElement;
          root.setAttribute('data-lb-theme', theme);
          root.setAttribute('data-lb-accent', accent);
          root.style.colorScheme = theme;
          try {
            var loc = localStorage.getItem('liveboom:locale');
            if (loc === 'zh') root.lang = 'zh-CN';
            else if (loc === 'es' || loc === 'en' || loc === 'fr' || loc === 'it' || loc === 'pt') root.lang = loc;
          } catch (langErr) {}
          var css = prefs.css;
          if (css && typeof css === 'object') {
            for (var key in css) {
              if (Object.prototype.hasOwnProperty.call(css, key) && key.indexOf('--') === 0) {
                root.style.setProperty(key, String(css[key]));
              }
            }
            if (css['--bg-primary']) {
              var themeMeta = document.querySelector('meta[name="theme-color"]');
              if (themeMeta) themeMeta.setAttribute('content', String(css['--bg-primary']));
            }
          }
        } catch (e) {
          document.documentElement.setAttribute('data-lb-theme', 'dark');
          document.documentElement.setAttribute('data-lb-accent', 'default');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="lb-boot-splash" aria-hidden="true">
      <img src="/brand/logo-clear.png" alt="" />
    </div>
    <style>
      #lb-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0b;
        overflow: hidden;
        pointer-events: auto;
      }
      #lb-boot-splash img {
        width: min(78vw, 17rem);
        height: min(46vw, 10rem);
        object-fit: cover;
        object-position: center 56%;
      }
      #lb-boot-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 180ms ease;
      }
    </style>
    <script>
      setTimeout(function () {
        var splash = document.getElementById('lb-boot-splash');
        if (splash) splash.classList.add('is-done');
      }, 12000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
