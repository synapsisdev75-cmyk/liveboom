services:
  postgres:
    image: postgres:16-alpine
    container_name: liveboom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: liveboom
      POSTGRES_PASSWORD: liveboom
      POSTGRES_DB: liveboom
    ports:
      - "5432:5432"
    volumes:
      - liveboom_pg:/var/lib/postgresql/data

volumes:
  liveboom_pg:
