query ListLiveStreams @auth(level: PUBLIC, insecureReason: "El feed de lives es público") {
  streams(
    where: { status: { eq: "LIVE" } }
    orderBy: [{ startedAt: DESC }]
    limit: 20
  ) {
    id
    title
    status
    isPrivate
    lockPrice
    startedAt
    creator {
      id
      username
      avatarUrl
      coinsBalance
    }
  }
}

query ListGifts @auth(level: PUBLIC, insecureReason: "El catálogo de regalos es público") {
  gifts(orderBy: [{ coinPrice: ASC }]) {
    id
    name
    imageUrl
    coinPrice
  }
}

query MyWallet @auth(level: USER) {
  users(where: { firebaseUid: { eq_expr: "auth.uid" } }) {
    id
    username
    email
    avatarUrl
    bio
    coinsBalance
  }
}

query GetUserByUsername($username: String!) @auth(level: PUBLIC, insecureReason: "Los perfiles públicos son visibles") {
  users(where: { username: { eq: $username } }, limit: 1) {
    id
    firebaseUid
    username
    email
    avatarUrl
    bio
    coinsBalance
    createdAt
  }
}

query SearchUsers($needle: String!) @auth(level: PUBLIC, insecureReason: "La búsqueda de creadores es pública") {
  users(
    where: {
      _or: [
        { username: { contains: $needle } }
        { bio: { contains: $needle } }
      ]
    }
    limit: 24
  ) {
    id
    username
    avatarUrl
    bio
    coinsBalance
  }
}

query MyTransactions @auth(level: USER) {
  transactions(
    where: { user: { firebaseUid: { eq_expr: "auth.uid" } } }
    orderBy: [{ createdAt: DESC }]
    limit: 50
  ) {
    id
    amount
    transactionType
    status
    createdAt
    referenceId
  }
}
